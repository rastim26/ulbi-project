name: CI (Lint • Test • Build • Visual Regression)
run-name: CI • ${{ github.ref_name }} • ${{ github.actor }}

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  #  1. Quick. Linting and tests
  lint_and_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 17.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint:ts

      - name: Lint CSS
        run: npm run lint:css

      - name: Run unit tests
        run: npm run test:unit

  #  2. Build production
  build:
    runs-on: ubuntu-latest
    needs: lint_and_test

    strategy:
      matrix:
        node-version: [ 17.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production project
        run: npm run build:prod

      - name: Build storybook
        run: npm run storybook:build

  #  3. Visual regression tests
  visual_tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Run visual regression tests
        run: npm run test:ui:ci


# Job order:
#   1.Install
#   2.Lint
#   3.Tests
#   4.Build
#   5.Visual regression tests